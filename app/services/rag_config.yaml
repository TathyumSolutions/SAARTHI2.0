embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
vector_store:
  url: http://qdrant:6333
  collection_name: saarthi_unstructured
  distance_metric: cosine
ingestion:
  supported_file_types:
  - .pdf
  - .docx
  - .doc
  - .md
  - .rtf
  - .txt
  images:
    extract_from_pdf: false
    extract_from_docx: true
    describe_with_vision_model: false
    min_image_size_bytes: 5000
chunking:
  strategy: fixed_size
  chunk_size: 800
  chunk_overlap: 80
  heading_aware:
    enabled: false
    keep_heading_path_in_metadata: true
  table:
    enabled: false
    keep_whole_if_under_rows: 200
    repeat_headers_on_split: true
    tag_siblings: true
retrieval:
  top_k: 3
  similarity_score_threshold: 0.0
  group_table_siblings: false
  hyde:
    enabled: false
    model: gpt-4o-mini
  multi_query:
    enabled: false
    num_variations: 3
    model: gpt-4o-mini
generation:
  temperature: 0
  max_tokens: 1024
  timeout_seconds: 300
  ollama_context_window: 8192
quality_checks:
  groundedness:
    enabled: false
    min_score_to_flag: 70
  relevance_check:
    enabled: false
    min_score_to_flag: 70
chain_of_thought:
  show_quality_check_steps: true
  show_retrieved_chunk_previews: false
self_learning:
  enabled: true
