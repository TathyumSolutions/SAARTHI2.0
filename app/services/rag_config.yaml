embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
vector_store:
  url: http://qdrant:6333
  collection_name: saarthi_unstructured
  distance_metric: cosine
ingestion:
  supported_file_types:
  - .pdf
  - .docx
  - .doc
  - .md
  - .rtf
  - .txt
  images:
    extract_from_pdf: false
    extract_from_docx: true
    describe_with_vision_model: false
    min_image_size_bytes: 5000
chunking:
  strategy: fixed_size
  chunk_size: 800
  chunk_overlap: 80
  heading_aware:
    enabled: false
    keep_heading_path_in_metadata: true
  table:
    enabled: false
    keep_whole_if_under_rows: 200
    repeat_headers_on_split: true
    tag_siblings: true
retrieval:
  top_k: 3
  similarity_score_threshold: 0.0
  group_table_siblings: false
  hyde:
    enabled: false
    model: gpt-4o-mini
  multi_query:
    enabled: false
    num_variations: 3
    model: gpt-4o-mini
generation:
  temperature: 0
  max_tokens: 1024
  timeout_seconds: 300
  ollama_context_window: 8192
quality_checks:
  groundedness:
    enabled: false
    min_score_to_flag: 70
  relevance_check:
    enabled: false
    min_score_to_flag: 70
chain_of_thought:
  show_quality_check_steps: true
  show_retrieved_chunk_previews: false
self_learning:
  enabled: true
# Drives the "LLM Calls" log (see Settings > LLM Call Logging, and the
# /llm_calls page) - every LLM invocation anywhere in the app is recorded
# here when enabled, with its token counts and a cost computed from the
# pricing table below. Disabling `enabled` turns logging into a no-op
# without touching any call site.
llm_logging:
  enabled: true
  # When false, only metering columns (tokens/cost/duration) are stored -
  # the actual prompt/response text is left out of the log.
  log_prompts: true
  preview_max_chars: 2000
  # USD cost per 1,000 tokens. Keys are matched against the model name
  # (exact match first, then substring), falling back to "default" (0 cost)
  # for any model not listed - e.g. free local Ollama models. Edit these
  # from Settings to reflect your provider's current pricing.
  pricing:
    default:
      input_per_1k: 0.0
      output_per_1k: 0.0
    gpt-4o-mini:
      input_per_1k: 0.00015
      output_per_1k: 0.0006
    gpt-4o:
      input_per_1k: 0.0025
      output_per_1k: 0.01
    claude-3-5-sonnet:
      input_per_1k: 0.003
      output_per_1k: 0.015
    claude-3-5-haiku:
      input_per_1k: 0.0008
      output_per_1k: 0.004
    gemini-1.5-pro:
      input_per_1k: 0.00125
      output_per_1k: 0.005
    gemini-1.5-flash:
      input_per_1k: 0.000075
      output_per_1k: 0.0003
    deepseek-chat:
      input_per_1k: 0.00027
      output_per_1k: 0.0011
