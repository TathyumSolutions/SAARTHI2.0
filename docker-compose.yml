services:
  web:
    build: .
    ports:
      - "5001:5000"
    env_file:
      - .env  
    environment:
      - FLASK_ENV=production
      #- DATABASE_URL=postgresql://saarthi:password@db:5432/postgres
      - REDIS_URL=redis://redis:6379/0
    # gthread instead of gevent: direct blocking psycopg2 calls in the
    # request pipeline aren't gevent-patched, so they stall gevent's
    # cooperative event loop - and the parallel SSE /stream_steps
    # connection with it - until the blocking call returns.
    # --preload runs create_app() once in the master before forking workers,
    # so DB bootstrap/schema sync runs once instead of once per worker.
    command: gunicorn --worker-class gthread --threads 4 --bind 0.0.0.0:5000 --workers 2 --timeout 5000 --preload run:app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully  # Wait for models to be ready

    volumes:
      - ./app:/app/app
      - ./requirements.txt:/app/requirements.txt:ro
      
      - uploads_data:/app/uploads
      # Persist NLTK data and the HuggingFace cache so container recreation
      # doesn't re-download punkt/punkt_tab and the sentence-transformers
      # embedding model on every `docker compose up`.
      - nltk_data:/root/nltk_data
      - hf_cache:/root/.cache/huggingface

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=saarthi
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U saarthi -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama 
    environment:
       - OLLAMA_KEEP_ALIVE=-1
       - OLLAMA_NUM_THREADS=6
    cpus: 6.0
    mem_limit: 8192m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-time model initialization - runs once, then exits
  ollama-init:
    image: ollama/ollama
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_KEEP_ALIVE=-1
    entrypoint: >
      sh -c "
        echo 'Waiting for Ollama to be ready...' &&
        sleep 2 &&
        for model in llama2:7b llama3:8b mistral:7b codellama:7b; do
          echo \"Pulling $$model...\" &&
          ollama pull $$model || exit 1 &&
          echo \"Warming $$model...\" &&
          ollama run $$model \"\" || exit 1;
        done &&
        echo 'All OSS models pulled and warmed!'
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  qdrant_data: 
  ollama_data:
  uploads_data:
  nltk_data:
  hf_cache:
