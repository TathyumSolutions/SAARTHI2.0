  - id: F1
    category: api
    sources: [API]
    question: What is India's lending interest rate for the latest year that has a value?
    expected_logic: World Bank FR.INR.LEND; skip null years; 8.57% for 2022. Not an NBFC benchmark.
    compare: {mode: facts}
    expected_facts: ["8.57", "2022"]

  - id: F2
    category: api
    sources: [API]
    question: Which district and state does PIN code 411001 belong to?
    expected_logic: api.postalpincode.in/pincode/411001 -> Pune, Maharashtra.
    compare: {mode: facts}
    expected_facts: ["Pune", "Maharashtra"]

  - id: F3
    category: api
    sources: [DB, DOC, XLSX, API]
    question: For branch {{branch_code}}, show agent-sourced loans disbursed in 2022 by product, with amount, amount-weighted interest rate and its gap to India's 2022 lending rate.
    expected_logic: >
      Weighted rate = sum(interest_rate x disbursed) / sum(disbursed); gap =
      weighted - 8.567 (World Bank 2022). Branch through loans.branch_id.
    reference_sql: |
      SELECT p.product_code, COUNT(*) AS loans, SUM(l.disbursed_amount) AS disbursed,
             ROUND(SUM(l.interest_rate * l.disbursed_amount) / SUM(l.disbursed_amount), 2) AS weighted_rate,
             ROUND(SUM(l.interest_rate * l.disbursed_amount) / SUM(l.disbursed_amount) - 8.56714285714286, 2) AS gap_pp
      FROM loans l JOIN loan_applications la ON la.application_id = l.application_id
      JOIN branches b ON b.branch_id = l.branch_id JOIN loan_products p ON p.product_id = l.product_id
      WHERE b.branch_code = '{{branch_code}}' AND la.agent_id IS NOT NULL
        AND l.disbursement_date BETWEEN '2022-01-01' AND '2022-12-31'
      GROUP BY p.product_code ORDER BY p.product_code
    compare: {mode: set, match_columns: [disbursed, weighted_rate], min_column_match: 1}
    expected_facts: ["8.57"]

